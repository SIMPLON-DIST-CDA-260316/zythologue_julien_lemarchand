services:
  postgres:
    image: postgres:18-alpine
    container_name: zythologue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zythologue}
      POSTGRES_USER: ${POSTGRES_USER:-zythologue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zythologue}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres18_cluster:/var/lib/postgresql
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-zythologue} -d ${POSTGRES_DB:-zythologue}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zythologue-api
    restart: unless-stopped
    # PORT n'est pas injecté : dans l'image le serveur écoute toujours 3000.
    # Seul le port publié côté hôte varie, via PORT du .env.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zythologue}
      POSTGRES_USER: ${POSTGRES_USER:-zythologue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zythologue}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Bind mount : le fichier hôte est la source de vérité, pas la couche image.
    # Le rechargement à chaud repose sur le polling de nodemon (cf. package.json),
    # car inotify n'est pas propagé au conteneur sous Docker Desktop Windows.
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/server.js:/app/apps/api/server.js
      - ./apps/api/public:/app/apps/api/public
    develop:
      watch:
        - action: rebuild
          path: ./pnpm-lock.yaml

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: zythologue-client
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    depends_on:
      - api
    # Montages ciblés plutôt que tout apps/client : monter le dossier entier
    # masquerait le node_modules de l'image (binaires Linux) par celui de l'hôte.
    volumes:
      - ./apps/client/src:/app/apps/client/src
      - ./apps/client/public:/app/apps/client/public
      - ./apps/client/index.html:/app/apps/client/index.html
      - ./apps/client/vite.config.ts:/app/apps/client/vite.config.ts
    develop:
      watch:
        - action: rebuild
          path: ./pnpm-lock.yaml

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  postgres18_cluster:
