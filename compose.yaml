services:
  postgres:
    image: postgres:18-alpine
    container_name: zythologue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zythologue}
      POSTGRES_USER: ${POSTGRES_USER:-zythologue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zythologue}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres18_cluster:/var/lib/postgresql
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-zythologue} -d ${POSTGRES_DB:-zythologue}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zythologue-api
    restart: unless-stopped
    # PORT n'est pas injecté : dans l'image le serveur écoute toujours 3000.
    # Seul le port publié côté hôte varie, via PORT du .env.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zythologue}
      POSTGRES_USER: ${POSTGRES_USER:-zythologue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zythologue}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${CLIENT_PORT:-5173}}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Uploads = données écrites par l'API : bind mount pour les garder sur l'hôte.
    volumes:
      - ./apps/api/public/uploads:/app/apps/api/public/uploads
    # Code : sync (cf. client), actif seulement avec `docker compose up --watch`.
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
          initial_sync: true
          ignore:
            - node_modules/
            - public/uploads/
        - action: rebuild
          path: ./pnpm-lock.yaml

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: zythologue-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    depends_on:
      - api
    # Lancer avec `docker compose up --watch` : sans --watch, rien n'est synchronisé.
    # sync copie dans le conteneur, où inotify fonctionne (pas de polling).
    develop:
      watch:
        - action: sync
          path: ./apps/client
          target: /app/apps/client
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: ./pnpm-lock.yaml

  adminer:
    image: adminer
    container_name: zythologue-adminer
    restart: unless-stopped
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres18_cluster:
